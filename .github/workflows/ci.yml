name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Compile all kernels to Metal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every clic kernel
        run: python3 tests/test_compile.py
